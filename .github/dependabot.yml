version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # typescript-eslint peer range caps TypeScript below 6.1 and ESLint at 9.x (see CLAUDE.md)
      - dependency-name: eslint
        update-types: [version-update:semver-major]
      - dependency-name: typescript
        versions: ['>=6.1.0']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        update-types: [minor, patch]
